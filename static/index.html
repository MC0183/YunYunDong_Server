<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务管理后台</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div id="app">
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-inner">
      <a class="nav-brand" href="#overview">
        <span class="brand-icon">🏃</span>
        <span class="brand-text">任务管理后台</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a class="nav-link active" data-page="overview" href="#overview">📊 概览</a>
        <a class="nav-link" data-page="tasks" href="#tasks">📋 任务管理</a>
        <a class="nav-link" data-page="logs" href="#logs">📁 运行日志</a>
      <a class="nav-link" data-page="requests" href="#requests" id="navRequests" style="display:none;">📋 删除申请</a>
      <a class="nav-link" data-page="messages" href="#messages" id="navMessages" style="display:none;">📬 消息</a>
      <a class="nav-link" data-page="audit" href="#audit">📝 操作日志</a>
      <a class="nav-link" data-page="contacts" href="#contacts" id="navContacts" style="display:none;">📞 联系方式</a>
      </div>
    </div>
  </nav>

  <main class="main" id="mainContent">
    <!-- 页面由 JS 动态渲染 -->
  </main>
</div>

<!-- 登录页面 -->
<div class="login-overlay" id="loginPage">
  <div class="login-box">
    <div class="login-icon">🏃</div>
    <h2 class="login-title">任务管理后台</h2>
    <div class="login-form">
      <input type="text" id="loginUser" class="input" placeholder="用户名" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
      <input type="password" id="loginPass" class="input" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
      <button class="btn btn-primary login-btn" onclick="doLogin()" id="loginBtn">登 录</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>
</div>

<!-- 添加任务弹窗 -->
<div class="modal-overlay" id="addModal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>添加任务</h2>
      <span class="modal-close" onclick="closeAddModal()">&times;</span>
    </div>
    <div class="modal-body">
      <label>用户名</label>
      <input type="text" id="addUser" placeholder="例如 JW250XXX" class="input">
      <label>密码</label>
      <input type="text" id="addPass" placeholder="密码" class="input">
      <label>学校</label>
      <input type="text" id="addSchool" value="安徽邮电职业技术学院" class="input">
      <p class="text-muted" style="margin-top:12px;">⚠️ 添加时会验证账号密码，通过后才保存任务</p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAddModal()">取消</button>
      <button class="btn btn-primary" onclick="doAddTask()">确认添加</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="deleteModal" onclick="closeModal(event)">
  <div class="modal modal-sm" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>确认删除</h2>
      <span class="modal-close" onclick="closeDeleteModal()">&times;</span>
    </div>
    <div class="modal-body">
      <p>确定要删除这个任务吗？此操作不可撤销。</p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDeleteModal()">取消</button>
      <button class="btn btn-danger" onclick="doDelete()">确认删除</button>
    </div>
  </div>
</div>

<!-- 删除申请弹窗 -->
<div class="modal-overlay" id="deleteRequestModal" onclick="closeModal(event)">
  <div class="modal modal-sm" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>申请删除任务</h2>
      <span class="modal-close" onclick="closeDeleteRequestModal()">&times;</span>
    </div>
    <div class="modal-body">
      <label>删除原因</label>
      <input type="text" id="deleteReason" placeholder="请填写删除原因" class="input">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDeleteRequestModal()">取消</button>
      <button class="btn btn-primary" onclick="submitDeleteRequest()">提交申请</button>
    </div>
  </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-overlay" id="changePwdModal" onclick="closeModal(event)">
  <div class="modal modal-sm" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>🔑 修改密码</h2>
      <span class="modal-close" onclick="closeChangePwdModal()">&times;</span>
    </div>
    <div class="modal-body">
      <p style="color:#aaa;font-size:13px;margin-bottom:12px;">修改云运动账号密码后，请在此同步更新</p>
      <label>新密码</label>
      <input type="text" id="newPwdInput" class="input" placeholder="输入新密码" autocomplete="new-password">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeChangePwdModal()">取消</button>
      <button class="btn btn-primary" onclick="doChangePassword()">确认修改</button>
    </div>
  </div>
</div>

<!-- 修改云运动密码弹窗 -->
<div class="modal-overlay" id="yunPwdModal" onclick="closeModal(event)">
  <div class="modal modal-sm" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>🏃 修改云运动密码</h2>
      <span class="modal-close" onclick="closeYunPwdModal()">&times;</span>
    </div>
    <div class="modal-body">
      <p style="color:#aaa;font-size:13px;margin-bottom:12px;">同步更新任务配置文件和云运动账号密码</p>
      <label>新密码</label>
      <input type="text" id="yunPwdInput" class="input" placeholder="输入新密码" autocomplete="off">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeYunPwdModal()">取消</button>
      <button class="btn btn-primary" onclick="doChangeYunPassword()">确认修改</button>
    </div>
  </div>
</div>

<!-- 联系方式弹窗 -->
<div class="modal-overlay" id="contactModal" onclick="closeModal(event)">
  <div class="modal" style="width:520px;" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>📞 联系方式</h2>
      <span class="modal-close" onclick="closeContactModal()">&times;</span>
    </div>
    <div class="modal-body" id="contactModalBody" style="max-height:65vh;overflow-y:auto;">
    </div>
    <div class="modal-footer" id="contactModalFooter">
      <button class="btn" onclick="closeContactModal()">关闭</button>
      <button class="btn btn-primary" onclick="saveContact()" id="saveContactBtn">保存</button>
    </div>
  </div>
</div>

<!-- 日志查看弹窗 -->
<div class="modal-overlay" id="logModal" onclick="closeModal(event)">
  <div class="modal modal-lg" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="logModalTitle">📄 日志内容</h2>
      <span class="modal-close" onclick="closeLogModal()">&times;</span>
    </div>
    <div class="modal-body">
      <pre class="log-modal-body" id="logModalContent"></pre>
    </div>
  </div>
</div>

<!-- 历史记录弹窗 -->
<div class="modal-overlay" id="historyModal" onclick="closeModal(event)">
  <div class="modal" style="width:600px;" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>📜 历史记录</h2>
      <span class="modal-close" onclick="closeHistoryModal()">&times;</span>
    </div>
    <div class="modal-body" id="historyBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
